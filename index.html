<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteLab — Entrar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center">
        <div class="notelab-card">
            <div class="text-center mb-4">
                <h1 class="serif-title fs-2 mb-1">NoteLab</h1>
                <p class="slogan mb-0">Um lugar para pensar com calma.</p>
            </div>

            <div id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="seu@email.com" required
                        autocomplete="email">
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required
                        autocomplete="current-password">
                </div>

                <button id="btn" type="submit" class="btn btn-notelab mb-2" id="submitBtn"
                    onclick="createAccount()">Entrar no espaço</button>

                <div id="feedback" class="feedback-msg" aria-live="polite"></div>

                <div class="text-center mt-3 pt-3 border-top" style="border-color: var(--stone) !important;">
                    <a href="#" class="notelab-link" id="createAccountLink">Primeira vez? Criar conta</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Tela de carregamento -->
    <div id="loadingScreen" class="loading-screen" role="status" aria-live="polite" aria-label="Carregando conteúdo"
        aria-busy="true">
        <div class="loading-brand">
            <span class="loading-mark" aria-hidden="true">N.</span>
            <span>NoteLab</span>
        </div>

        <div class="loading-caption">
            <div class="loader" aria-hidden="true"></div>
            <p id="loadingMessage">Preparando seu espaço</p>
        </div>
    </div>

    <!-- Notificação personalizada -->

    <div id="customAlert" class="custom-alert" role="alert">
        <div class="alert-content">
            <strong id="alertTitle">Aviso</strong>
            <p id="alertMessage">Email ou senha inválidos.</p>
        </div>

        <button class="alert-close" onclick="closeAlert()" aria-label="Fechar">
            &times;
        </button>
    </div>


    <script src="./Js/script.js"></script>
</body>

</html>
